name: Build KernelSU ZIP

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - ".gitattributes"
      - ".github/workflows/package.yml"
      - "build-inputs/**"
      - "kernel/**"
      - "module/**"
      - "scripts/**"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      LLVM: "-17"
    outputs:
      filename: ${{ steps.zip.outputs.filename }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: zip
        name: Check the package version
        run: |
          version=$(sed -n 's/^version=//p' module/module.prop)
          if [[ ! "$version" =~ ^[0-9][0-9A-Za-z.+-]*$ ]]; then
            echo "Invalid package version in module/module.prop" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Expected version tag v$version" >&2
            exit 1
          fi
          printf 'filename=duchamp-gzvm-%s.zip\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Install kernel build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential clang-17 device-tree-compiler \
            flex libelf-dev libssl-dev lld-17 llvm-17 pahole

      - name: Prepare pinned Android kernel
        run: |
          revision=$(cat build-inputs/commit)
          git init "$RUNNER_TEMP/gki-common"
          git -C "$RUNNER_TEMP/gki-common" fetch --depth=1 \
            https://android.googlesource.com/kernel/common "$revision"
          git -C "$RUNNER_TEMP/gki-common" checkout --detach FETCH_HEAD
          sh scripts/prepare-kernel.sh "$RUNNER_TEMP/gki-common" "$RUNNER_TEMP/gki-out"

      - name: Compile and package both modules
        env:
          PACKAGE: ${{ steps.zip.outputs.filename }}
        run: |
          sh scripts/build.sh "$RUNNER_TEMP/gki-common" "$RUNNER_TEMP/gki-out"
          python3 scripts/package.py kernel "$RUNNER_TEMP/gki-out/Module.symvers" "dist/$PACKAGE"
          python3 -m zipfile -t "dist/$PACKAGE"
          cd dist
          sha256sum "$PACKAGE" > "$PACKAGE.sha256"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: duchamp-gzvm
          path: |
            dist/${{ steps.zip.outputs.filename }}
            dist/${{ steps.zip.outputs.filename }}.sha256
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency: publish-${{ contains(github.ref_name, '-') && 'prerelease' || github.ref }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: duchamp-gzvm
          path: dist

      - name: Publish the ZIP and checksum
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ needs.package.outputs.filename }}
        run: |
          sha256sum --check "$PACKAGE.sha256"
          is_prerelease=false
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            is_prerelease=true
            release_flags+=(--prerelease)
          fi
          if published=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease 2>/dev/null); then
            jq -e --argjson prerelease "$is_prerelease" \
              '.isDraft == false and .isPrerelease == $prerelease' <<< "$published" >/dev/null
            published_dir=$(mktemp -d)
            gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --pattern "$PACKAGE" --pattern "$PACKAGE.sha256" --dir "$published_dir"
            cmp "$PACKAGE.sha256" "$published_dir/$PACKAGE.sha256"
            (cd "$published_dir" && sha256sum --check "$PACKAGE.sha256")
          else
            gh release create "$GITHUB_REF_NAME" "$PACKAGE" "$PACKAGE.sha256" \
              --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes "${release_flags[@]}"
          fi

      - name: Keep the latest published prerelease
        if: contains(github.ref_name, '-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          releases=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100")
          obsolete_ids=$(jq -er --arg current "$GITHUB_REF_NAME" '
            [.[][] | select(.prerelease and (.draft | not))]
            | if any(.[]; .tag_name == $current) then
                sort_by(.published_at, .id) | .[:-1] | map(.id) | join("\n")
              else
                error("Published prerelease not found")
              end
          ' <<< "$releases")
          while IFS= read -r release_id; do
            [[ -n "$release_id" ]] || continue
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$release_id"
          done <<< "$obsolete_ids"
